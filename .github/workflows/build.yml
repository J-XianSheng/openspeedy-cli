name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust targets
        run: rustup target add i686-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Get version
        id: version
        run: |
          $ver = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Build (CLI)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Smoke test
        working-directory: src-tauri/target/release
        run: |
          foreach ($f in 'openspeedy.exe', 'bridge32.exe', 'bridge64.exe', 'speedpatch32.dll', 'speedpatch64.dll') {
            if (-not (Test-Path $f)) { throw "missing artifact: $f" }
          }
          .\openspeedy.exe --help
          if ($LASTEXITCODE -ne 0) { throw "openspeedy --help failed" }
          .\openspeedy.exe version
          if ($LASTEXITCODE -ne 0) { throw "openspeedy version failed" }
          .\openspeedy.exe list
          if ($LASTEXITCODE -ne 0) { throw "openspeedy list failed" }

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: OpenSpeedy-${{ steps.version.outputs.version }}-cli
          path: |
            src-tauri/target/release/openspeedy.exe
            src-tauri/target/release/bridge32.exe
            src-tauri/target/release/bridge64.exe
            src-tauri/target/release/speedpatch32.dll
            src-tauri/target/release/speedpatch64.dll
          if-no-files-found: error
