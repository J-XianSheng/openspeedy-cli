[package]
name = "openspeedy"
version = "3.3.16"
description = "Open Source Game Speed Controller (CLI)"
authors = ["Game1024"]
edition = "2021"

# Command-line only: no GUI, no WebView, no frontend build step.

[lib]
# The `_lib` suffix is kept for the same reason as upstream — the lib name must
# differ from the bin name on Windows, see rust-lang/cargo#8519.
name = "openspeedy_lib"
crate-type = ["rlib"]

[build-dependencies]
cmake = "0.1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }
